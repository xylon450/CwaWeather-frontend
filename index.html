<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>自然天氣</title>
    <link rel="icon" type="image/png" href="./icon-v2.png">
    <link rel="apple-touch-icon" href="./icon-v2.png">
    <link rel="apple-touch-icon" sizes="180x180" href="./icon-v2.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --nature-forest: #2F5233;
            --nature-sage: #9CAF88;
            --nature-cream: #F7F5F3;
            --nature-sand: #E8DCC6;
            --nature-earth: #8B4513;
            --nature-sky: #87CEEB;
            --nature-moss: #68A357;
            --nature-bark: #4A3728;
            --nature-mist: #E6F3E6;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background: linear-gradient(135deg, var(--nature-sage) 0%, var(--nature-moss) 100%);
            /* 自然紋理背景 */
            background-image: 
                radial-gradient(circle at 20% 50%, rgba(255, 255, 255, 0.1) 2px, transparent 2px),
                radial-gradient(circle at 80% 20%, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(45deg, rgba(255, 255, 255, 0.02) 25%, transparent 25%),
                linear-gradient(-45deg, rgba(255, 255, 255, 0.02) 25%, transparent 25%);
            background-size: 100px 100px, 50px 50px, 30px 30px, 30px 30px;
            min-height: 100vh;
            color: var(--nature-forest);
            overflow-x: hidden;
            padding-bottom: 20px;
        }

        /* 頂部狀態列 */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: rgba(47, 82, 51, 0.15);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .location-pill {
            background: linear-gradient(135deg, var(--nature-sand) 0%, var(--nature-cream) 100%);
            color: var(--nature-earth);
            padding: 8px 18px;
            border-radius: 25px;
            font-weight: 700;
            font-size: 1.1rem;
            border: 2px solid var(--nature-cream);
            box-shadow: 
                0 4px 15px rgba(139, 69, 19, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.5);
            position: relative;
        }

        .location-pill::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(135deg, var(--nature-moss), var(--nature-forest));
            border-radius: 25px;
            z-index: -1;
        }

        .update-pill {
            font-size: 0.85rem;
            color: var(--nature-cream);
            background: rgba(47, 82, 51, 0.7);
            padding: 6px 12px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .container {
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        /* === 核心：今日焦點卡片 === */
        .hero-card {
            background: linear-gradient(135deg, var(--nature-cream) 0%, var(--nature-mist) 100%);
            border-radius: 30px;
            padding: 35px 30px;
            text-align: center;
            box-shadow: 
                0 20px 40px rgba(47, 82, 51, 0.2),
                0 10px 20px rgba(47, 82, 51, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.8);
            border: 3px solid rgba(255, 255, 255, 0.5);
            margin-bottom: 25px;
            position: relative;
            overflow: hidden;
        }

        .hero-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(156, 175, 136, 0.1) 0%, transparent 70%);
            animation: naturePulse 6s ease-in-out infinite;
        }

        @keyframes naturePulse {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.1) rotate(180deg); }
        }

        /* 自然風格的對話氣泡 */
        .hero-period {
            position: absolute;
            top: -18px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, var(--nature-forest) 0%, var(--nature-moss) 100%);
            color: var(--nature-cream);
            padding: 8px 24px;
            border-radius: 20px;
            font-weight: 700;
            border: 3px solid var(--nature-cream);
            box-shadow: 0 6px 0 rgba(47, 82, 51, 0.3);
            position: relative;
            z-index: 2;
        }

        .hero-period::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border: 8px solid transparent;
            border-top-color: var(--nature-forest);
        }

        .hero-temp-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin: 20px 0;
            position: relative;
            z-index: 1;
        }

        .hero-icon {
            font-size: 5.5rem;
            filter: drop-shadow(0 6px 0 rgba(47, 82, 51, 0.2));
            animation: naturalFloat 4s ease-in-out infinite;
        }

        @keyframes naturalFloat {
            0%, 100% {
                transform: translateY(0) rotate(-2deg);
            }
            50% {
                transform: translateY(-15px) rotate(2deg);
            }
        }

        .hero-temp {
            font-size: 4.8rem;
            font-weight: 900;
            color: var(--nature-forest);
            line-height: 1;
            text-shadow: 0 2px 0 rgba(255, 255, 255, 0.5);
        }

        .hero-desc {
            font-size: 1.6rem;
            color: var(--nature-earth);
            margin-bottom: 25px;
            font-weight: 600;
            position: relative;
            z-index: 1;
        }

        /* === 自然風格建議區 === */
        .advice-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 25px;
            padding-top: 25px;
            border-top: 2px solid var(--nature-sage);
            position: relative;
        }

        .advice-grid::before {
            content: '🌿';
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--nature-cream);
            padding: 5px 10px;
            border-radius: 50%;
            font-size: 1.2rem;
        }

        .advice-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.8) 0%, rgba(156, 175, 136, 0.2) 100%);
            padding: 15px;
            border-radius: 20px;
            border: 2px solid rgba(156, 175, 136, 0.3);
            box-shadow: 0 4px 15px rgba(47, 82, 51, 0.1);
        }

        .advice-icon {
            font-size: 2.2rem;
            margin-bottom: 8px;
            filter: drop-shadow(0 2px 4px rgba(47, 82, 51, 0.2));
        }

        .advice-text {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--nature-forest);
            margin: 8px 0;
            line-height: 1.3;
        }

        /* === 稍後預報：自然風格滑動區 === */
        .section-title {
            font-size: 1.3rem;
            color: var(--nature-cream);
            margin-bottom: 18px;
            margin-left: 15px;
            font-weight: 700;
            text-shadow: 0 2px 4px rgba(47, 82, 51, 0.5);
            position: relative;
        }

        .section-title::before {
            content: '🍃';
            margin-right: 10px;
        }

        .scroll-container {
            display: flex;
            overflow-x: auto;
            gap: 18px;
            padding-bottom: 15px;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .scroll-container::-webkit-scrollbar {
            display: none;
        }

        .mini-card {
            min-width: 145px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.95) 0%, var(--nature-mist) 100%);
            border-radius: 25px;
            padding: 22px 18px;
            text-align: center;
            border: 2px solid rgba(156, 175, 136, 0.4);
            flex-shrink: 0;
            box-shadow: 0 8px 25px rgba(47, 82, 51, 0.15);
            position: relative;
            overflow: hidden;
        }

        .mini-card::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(156, 175, 136, 0.1) 0%, transparent 60%);
        }

        .mini-time {
            background: linear-gradient(135deg, var(--nature-moss) 0%, var(--nature-forest) 100%);
            color: var(--nature-cream);
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.85rem;
            display: inline-block;
            margin-bottom: 12px;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.3);
            position: relative;
            z-index: 1;
        }

        .mini-icon {
            font-size: 2.8rem;
            margin: 8px 0;
            filter: drop-shadow(0 3px 6px rgba(47, 82, 51, 0.2));
            position: relative;
            z-index: 1;
        }

        .mini-temp {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--nature-forest);
            position: relative;
            z-index: 1;
        }

        /* Loading 畫面 */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, var(--nature-sage) 0%, var(--nature-moss) 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        .loading-screen div {
            font-size: 4.5rem;
            animation: naturalBounce 2.5s infinite ease-in-out;
        }

        .loading-screen p {
            color: var(--nature-cream);
            font-weight: 600;
            margin-top: 25px;
            font-size: 1.1rem;
            text-shadow: 0 2px 4px rgba(47, 82, 51, 0.5);
        }

        @keyframes naturalBounce {
            0%, 100% {
                transform: translateY(0) rotate(-5deg) scale(1);
            }
            25% {
                transform: translateY(-20px) rotate(5deg) scale(1.05);
            }
            50% {
                transform: translateY(-10px) rotate(-2deg) scale(1.02);
            }
            75% {
                transform: translateY(-15px) rotate(3deg) scale(1.03);
            }
        }

        /* 自然風格的微互動 */
        .mini-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(47, 82, 51, 0.25);
            transition: all 0.3s ease;
        }

        .advice-item:hover {
            transform: scale(1.05);
            transition: all 0.2s ease;
        }

        .hero-card:hover .hero-icon {
            animation-duration: 2s;
        }

        /* 響應式設計 */
        @media (max-width: 480px) {
            .container {
                padding: 15px;
            }
            
            .hero-card {
                padding: 25px 20px;
            }
            
            .hero-temp {
                font-size: 4rem;
            }
            
            .hero-icon {
                font-size: 4.5rem;
            }
        }
    </style>
</head>

<body>
    <div id="loading" class="loading-screen">
        <div>🌿</div>
        <p>感受大自然的氣息...</p>
    </div>
    
    <div class="status-bar">
        <div class="location-pill">🌲 臺東</div>
        <div id="updateTime" class="update-pill">更新中...</div>
    </div>

    <div class="container" id="mainContent" style="display: none;">
        <div id="heroCard"></div>
        
        <h3 class="section-title">自然預報</h3>
        <div class="scroll-container" id="futureForecasts"></div>
    </div>

    <script>
        const API_URL = "https://weather-kaos-xylon.zeabur.app/api/weather/kaohsiung";

        function getWeatherIcon(weather) {
            if (!weather) return "🌿";
            if (weather.includes("晴")) return "🌞";
            if (weather.includes("多雲")) return "☁️";
            if (weather.includes("陰")) return "🌫️";
            if (weather.includes("雨")) return "🌧️";
            if (weather.includes("雷")) return "⛈️";
            return "🌿";
        }

        function getAdvice(rainProb, maxTemp) {
            let rainIcon = "🌂";
            let rainText = "陽光普照";
            if (parseInt(rainProb) > 30) {
                rainIcon = "☔";
                rainText = "雨傘必備！";
            }

            let clothIcon = "🍃";
            let clothText = "自然舒適";
            if (parseInt(maxTemp) >= 28) {
                clothIcon = "🌞";
                clothText = "清涼穿搭";
            } else if (parseInt(maxTemp) <= 20) {
                clothIcon = "🧥";
                clothText = "溫暖外套";
            }

            return { rainIcon, rainText, clothIcon, clothText };
        }

        function getTimePeriod(startTime) {
            const hour = new Date(startTime).getHours();
            if (hour >= 5 && hour < 11) return "清晨";
            if (hour >= 11 && hour < 14) return "正午";
            if (hour >= 14 && hour < 18) return "午後";
            if (hour >= 18 && hour < 23) return "夜晚";
            return "深夜";
        }

        function renderWeather(data) {
            const forecasts = data.forecasts;
            const current = forecasts[0];
            const others = forecasts.slice(1);

            // 1. 渲染 Hero Card (主畫面)
            const advice = getAdvice(current.rain, current.maxTemp);
            const period = getTimePeriod(current.startTime);
            const avgTemp = Math.round((parseInt(current.maxTemp) + parseInt(current.minTemp)) / 2);

            document.getElementById('heroCard').innerHTML = `
                <div class="hero-card">
                    <div class="hero-period">${period}</div>
                    <div class="hero-temp-container">
                        <div class="hero-icon">${getWeatherIcon(current.weather)}</div>
                        <div class="hero-temp">${avgTemp}°</div>
                    </div>
                    <div class="hero-desc">${current.weather}</div>
                    
                    <div class="advice-grid">
                        <div class="advice-item">
                            <div class="advice-icon">${advice.rainIcon}</div>
                            <div class="advice-text">${advice.rainText}</div>
                            <div style="font-size:0.75rem; color:var(--nature-earth); opacity:0.8">降雨率 ${current.rain}</div>
                        </div>
                        <div class="advice-item">
                            <div class="advice-icon">${advice.clothIcon}</div>
                            <div class="advice-text">${advice.clothText}</div>
                            <div style="font-size:0.75rem; color:var(--nature-earth); opacity:0.8">最高溫 ${current.maxTemp}°</div>
                        </div>
                    </div>
                </div>
            `;

            // 2. 渲染稍後預報
            const scrollContainer = document.getElementById('futureForecasts');
            scrollContainer.innerHTML = '';

            const todayDate = new Date().getDate();

            others.forEach(f => {
                let p = getTimePeriod(f.startTime);

                const fDate = new Date(f.startTime);
                if (fDate.getDate() !== todayDate) {
                    p = "明日" + p;
                }

                scrollContainer.innerHTML += `
                    <div class="mini-card">
                        <div class="mini-time">${p}</div>
                        <div class="mini-icon">${getWeatherIcon(f.weather)}</div>
                        <div class="mini-temp">${f.minTemp}° - ${f.maxTemp}°</div>
                        <div style="font-size:0.8rem; color:var(--nature-earth); margin-top:8px; opacity:0.7;">💧${f.rain}</div>
                    </div>
                `;
            });

            // 3. 右上角顯示今日日期
            const now = new Date();
            const month = now.getMonth() + 1;
            const date = now.getDate();
            const dayIndex = now.getDay();
            const days = ["週日", "週一", "週二", "週三", "週四", "週五", "週六"];

            document.getElementById('updateTime').textContent = `${month}月${date}日 ${days[dayIndex]}`;
        }

        async function fetchWeather() {
            try {
                const delayPromise = new Promise(resolve => setTimeout(resolve, 1800));
                const fetchPromise = fetch(API_URL).then(res => res.json());
                
                const [_, json] = await Promise.all([delayPromise, fetchPromise]);

                if (json.success) {
                    renderWeather(json.data);
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('mainContent').style.display = 'block';
                } else {
                    throw new Error("API Error");
                }
            } catch (e) {
                console.error(e);
                alert("大自然的訊息暫時無法傳達，請稍後再試！");
            }
        }

        document.addEventListener("DOMContentLoaded", fetchWeather);
    </script>
</body>

</html>
